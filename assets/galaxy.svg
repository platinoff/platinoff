<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img">
  <title>Platinoff ecosystem — one GitHub, one galaxy, all Rust-first</title>
  <desc>Public repositories orbit the GSV hub. SMIL, no JavaScript.</desc>
  <defs>
    <linearGradient id="ec-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05030f"/>
      <stop offset="50%" stop-color="#0b0720"/>
      <stop offset="100%" stop-color="#120a2e"/>
    </linearGradient>
    <radialGradient id="ec-hub" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#9945ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#9945ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0b0720" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ec-smil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14f195"/>
      <stop offset="100%" stop-color="#9945ff"/>
    </linearGradient>
    <style>
      .edge { fill: none; stroke-width: 1.4; }
      .edge-gsv { stroke: #9945ff; stroke-opacity: 0.5; }
      .pulse { stroke: #f4f0ff; stroke-width: 2; stroke-dasharray: 10 260; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#ec-sky)"/>
  <rect width="1280" height="640" fill="url(#ec-hub)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g fill="#8d82ad" opacity="0.75">
    <circle cx="90" cy="40" r="1.3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="96" r="1.1"><animate attributeName="opacity" values="0.12;0.85;0.12" dur="4.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="312" cy="28" r="1.6"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="517" cy="36" r="1.0"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.7s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="701" cy="26" r="1.3"><animate attributeName="opacity" values="0.16;1;0.16" dur="5.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="896" cy="42" r="1.7"><animate attributeName="opacity" values="0.1;0.92;0.1" dur="2.7s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1186" cy="74" r="1.2"><animate attributeName="opacity" values="0.18;0.86;0.18" dur="4.2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1232" cy="430" r="1.4"><animate attributeName="opacity" values="0.12;1;0.12" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="520" r="1.2"><animate attributeName="opacity" values="0.14;0.9;0.14" dur="3.9s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <path class="edge edge-gsv" d="M640 300 L180 140"/>
    <path class="pulse" d="M640 300 L180 140"><animate attributeName="stroke-dashoffset" from="0" to="-540" dur="3.2s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M640 300 L390 96"/>
    <path class="pulse" d="M640 300 L390 96"><animate attributeName="stroke-dashoffset" from="0" to="-520" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M640 300 L900 96"/>
    <path class="pulse" d="M640 300 L900 96"><animate attributeName="stroke-dashoffset" from="0" to="-520" dur="3.5s" begin="0.6s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M640 300 L1120 150"/>
    <path class="pulse" d="M640 300 L1120 150"><animate attributeName="stroke-dashoffset" from="0" to="-560" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M640 300 L1140 330"/>
    <path class="pulse" d="M640 300 L1140 330"><animate attributeName="stroke-dashoffset" from="0" to="-540" dur="3.7s" begin="1.2s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M640 300 L1000 500"/>
    <path class="pulse" d="M640 300 L1000 500"><animate attributeName="stroke-dashoffset" from="0" to="-590" dur="3.8s" begin="1.5s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M640 300 L640 548"/>
    <path class="pulse" d="M640 300 L640 548"><animate attributeName="stroke-dashoffset" from="0" to="-520" dur="3.3s" begin="1.8s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M640 300 L300 500"/>
    <path class="pulse" d="M640 300 L300 500"><animate attributeName="stroke-dashoffset" from="0" to="-560" dur="3.5s" begin="2.1s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M640 300 L220 250"/>
    <path class="pulse" d="M640 300 L220 250"><animate attributeName="stroke-dashoffset" from="0" to="-540" dur="3.1s" begin="2.4s" repeatCount="indefinite"/></path>
  </g>

  <g transform="translate(640 300)">
    <circle r="46" fill="#9945ff" fill-opacity="0.18"><animate attributeName="r" values="40;58;40" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="24" fill="url(#ec-smil)"/>
    <text y="-108" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="15" fill="#f4f0ff" font-weight="600">hub · vision · 9999</text>
    <text y="-90" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12" fill="#8d82ad">keep-alive · Galaxy UI · MCP</text>
    <text y="6" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0b0720">GSV</text>
  </g>

  <g transform="translate(180 140)">
    <circle r="14" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="12;16;12" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <text y="32" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">poolAI</text>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">GPU grid + Solana · 8091</text>
  </g>
  <g transform="translate(390 96)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text y="30" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">LinFS</text>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">Linux FS on Windows</text>
  </g>
  <g transform="translate(900 96)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <text y="30" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">llama-rs</text>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">local LLM · 8080</text>
  </g>
  <g transform="translate(1120 150)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text y="30" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">OmniRoute</text>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">free AI gateway</text>
  </g>
  <g transform="translate(1140 330)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.9s" begin="1.0s" repeatCount="indefinite"/></circle>
    <text y="32" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">ORR_DESKTOP</text>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">desktop remote</text>
  </g>
  <g transform="translate(1000 500)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <text y="-22" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">rebook</text>
    <text y="-8" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">ebook viewer</text>
  </g>
  <g transform="translate(640 548)">
    <circle r="14" fill="#fbbf24" fill-opacity="0.95"><animate attributeName="r" values="12;16;12" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text y="-24" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#fbbf24">sport-forcast</text>
    <text y="-10" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">journal binary · 9741</text>
  </g>
  <g transform="translate(300 500)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <text y="-22" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">telenetis</text>
    <text y="-8" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">Telegram shell · 9800</text>
  </g>
  <g transform="translate(220 250)">
    <circle r="18" fill="#fbbf24" fill-opacity="0.95"><animate attributeName="r" values="16;22;16" dur="2.2s" repeatCount="indefinite"/></circle>
    <text y="6" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#0b0720">R</text>
    <text y="40" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#fbbf24">rusty</text>
    <text y="58" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12" fill="#e9e4ff">MoE · 8090</text>
  </g>

  <text x="640" y="624" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#6d6386" letter-spacing="1.5">ONE GITHUB · ONE GALAXY · PUBLIC PLUGINS · SMIL | NO JS | NO FILTER</text>
</svg>
