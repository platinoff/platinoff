<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img">
  <title>Platinoff ecosystem — one GitHub, one galaxy, all Rust-first</title>
  <desc>Every repository is a living node around the GSV hub. SMIL, no JavaScript.</desc>
  <defs>
    <linearGradient id="ec-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05030f"/>
      <stop offset="50%" stop-color="#0b0720"/>
      <stop offset="100%" stop-color="#120a2e"/>
    </linearGradient>
    <radialGradient id="ec-hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9945ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#9945ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0b0720" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="520" fill="url(#ec-sky)"/>
  <rect width="1280" height="520" fill="url(#ec-hub)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g fill="#8d82ad" opacity="0.75">
    <circle cx="90" cy="40" r="1.3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="96" r="1.1"><animate attributeName="opacity" values="0.12;0.85;0.12" dur="4.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="312" cy="28" r="1.6"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="433" cy="140" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="517" cy="38" r="1.0"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.7s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="112" r="1.5"><animate attributeName="opacity" values="0.12;0.88;0.12" dur="3.3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="701" cy="26" r="1.3"><animate attributeName="opacity" values="0.16;1;0.16" dur="5.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="788" cy="66" r="1.1"><animate attributeName="opacity" values="0.14;0.82;0.14" dur="4.0s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="896" cy="42" r="1.7"><animate attributeName="opacity" values="0.1;0.92;0.1" dur="2.7s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1186" cy="74" r="1.2"><animate attributeName="opacity" values="0.18;0.86;0.18" dur="4.2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1232" cy="330" r="1.4"><animate attributeName="opacity" values="0.12;1;0.12" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <defs>
    <style>
      .edge { fill: none; stroke-width: 1.4; }
      .edge-gsv { stroke: #9945ff; stroke-opacity: 0.5; }
      .pulse { stroke: #f4f0ff; stroke-width: 2; stroke-dasharray: 10 260; stroke-linecap: round; }
    </style>
    <linearGradient id="ec-smil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14f195"/>
      <stop offset="100%" stop-color="#9945ff"/>
    </linearGradient>
  </defs>

  <g>
    <path class="edge edge-gsv" d="M645 260 L190 120"/>
    <path class="pulse" d="M645 260 L190 120"><animate attributeName="stroke-dashoffset" from="0" to="-540" dur="3.2s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M645 260 L330 90"/>
    <path class="pulse" d="M645 260 L330 90"><animate attributeName="stroke-dashoffset" from="0" to="-520" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M645 260 L955 90"/>
    <path class="pulse" d="M645 260 L955 90"><animate attributeName="stroke-dashoffset" from="0" to="-520" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M645 260 L1095 165"/>
    <path class="pulse" d="M645 260 L1095 165"><animate attributeName="stroke-dashoffset" from="0" to="-560" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M645 260 L1095 375"/>
    <path class="pulse" d="M645 260 L1095 375"><animate attributeName="stroke-dashoffset" from="0" to="-590" dur="3.8s" begin="1.6s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M645 260 L955 440"/>
    <path class="pulse" d="M645 260 L955 440"><animate attributeName="stroke-dashoffset" from="0" to="-540" dur="3.3s" begin="2.0s" repeatCount="indefinite"/></path>
    <path class="edge edge-gsv" d="M645 260 L295 435"/>
    <path class="pulse" d="M645 260 L295 435"><animate attributeName="stroke-dashoffset" from="0" to="-560" dur="3.5s" begin="2.4s" repeatCount="indefinite"/></path>
  </g>

  <g transform="translate(645 260)">
    <circle r="46" fill="#9945ff" fill-opacity="0.18"><animate attributeName="r" values="40;58;40" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="24" fill="url(#ec-smil)"/>
    <text y="6" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0b0720">GSV</text>
    <text y="74" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="15" fill="#f4f0ff" font-weight="600">GSV — hub · vision · 9999</text>
    <text y="92" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12" fill="#8d82ad">keep-alive bus + Galaxy UI + MCP</text>
  </g>

  <g transform="translate(190 120)">
    <circle r="14" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="12;16;12" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <text y="32" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">poolAI</text>
    <text y="50" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">GPU grid + Solana</text>
  </g>
  <g transform="translate(330 90)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text y="30" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">LinFS</text>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">Linux FS on Windows</text>
  </g>
  <g transform="translate(955 90)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></circle>
    <text y="30" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">llama-rs</text>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">local LLM · Qwen 27B</text>
  </g>
  <g transform="translate(1095 165)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.7s" begin="0.9s" repeatCount="indefinite"/></circle>
    <text y="30" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">OmniRoute</text>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">free AI gateway</text>
  </g>
  <g transform="translate(1095 375)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></circle>
    <text y="-12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">ORR_DESKTOP</text>
    <text y="6" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">Rust desktop remote</text>
  </g>
  <g transform="translate(955 440)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
    <text y="-12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">rebook</text>
    <text y="6" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">ebook viewer</text>
  </g>
  <g transform="translate(295 435)">
    <circle r="13" fill="#14f195" fill-opacity="0.9"><animate attributeName="r" values="11;15;11" dur="2.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <text y="-12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14f195">telenetis</text>
    <text y="6" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#8d82ad">Telegram Mini App</text>
  </g>

  <text x="640" y="510" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#6d6386" letter-spacing="1.5">ONE GITHUB · ONE GALAXY · ALL RUST-FIRST · SMIL | NO JS | NO FILTER</text>
</svg>